<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        body{
            background-color:lightskyblue;
        }
    </style>
</head>
<body>
    <center>
        <h1> BMI CALCULATOR</h1>
        <form>
            Height:<input type="number" id="height" required>
            <select id="Hgt" required>
                <option value="inches">inches</option>
                <option value="cm">cm</option>
            </select><br><br>

            Weight:<input type="number" id="weight" required>
            <select id="Wght" required>
                <option value="pounds">pounds</option>
                <option value="kg">kg</option>
            </select><br><br>

            <button type="button" onclick="Result()">Calculate</button><br><br>

            <label for="result">Result</label>
            <input type="text" name="result" id="result" readonly><br><br>

            Description:<input type="text" name="Description" id="Description" readonly>
        </form>
    </center>
    <script>
        function Result() {
            let height = Number(document.getElementById('height').value);
            let weight = Number(document.getElementById('weight').value);
            let Hgt = document.getElementById("Hgt").value;
            let Wght = document.getElementById("Wght").value;
            let value;
            if (Wght === "kg" && Hgt === "cm") {
                value = weight / ((height / 100) * (height / 100));
            } 
            else if (Wght === "pounds" && Hgt === "inches") {
                value = (weight / (height * height)) * 703;
            } 
            else if (Wght === "kg" && Hgt === "inches") {
                let a = 0.0254 * height;
                value = weight / (a * a);
            } 
            else {
                value = (0.453592 * weight) / ((height / 100) * (height / 100));
            }
            document.getElementById('result').value = `Your BMI is ${value.toFixed(2)}`;
            let description;
            if (value < 18.5) {
                description = "Underweight";
            } else if (value >= 18.5 && value <= 24.9) {
                description = "Normal weight";
            } else if (value >= 25 && value <= 29.9) {
                description = "Overweight";
            } else {
                description = "Obesity";
            }
            document.getElementById("Description").value = description;
        }
    </script>
</body>
</html>
